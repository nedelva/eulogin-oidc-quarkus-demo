# =============================================================================
# Production -- EU Login OIDC
# =============================================================================
%prod.quarkus.oidc.auth-server-url=https://ecas.ec.europa.eu/cas/oauth2
%prod.quarkus.oidc.client-id=eulogin-oicd-quarkus-demo
%prod.quarkus.oidc.credentials.jwt.secret=${OIDC_CLIENT_SECRET}
%prod.quarkus.oidc.authentication.scopes=openid,email,profile,hr

# =============================================================================
# Shared OIDC settings
# =============================================================================
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.redirect-path=/secure/ecas/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.authentication.cookie-same-site=strict
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/hello

# =============================================================================
# Keycloak DevServices -- starts automatically in dev/test mode
# (requires Docker; no quarkus.oidc.auth-server-url in dev triggers DevServices)
# =============================================================================
quarkus.keycloak.devservices.realm-path=eulogin-realm.json
%dev.quarkus.oidc.token-state-manager.encryption-secret=dev-only-secret-at-least-32-chars!

# =============================================================================
# HTTP Auth Permissions
# =============================================================================
quarkus.http.auth.permission.public.paths=/hello,/rest/user,/rest/me,/q/*
quarkus.http.auth.permission.public.policy=permit

quarkus.http.auth.permission.secured.paths=/secure/*
quarkus.http.auth.permission.secured.policy=authenticated

quarkus.http.auth.permission.admin.paths=/admin/*
quarkus.http.auth.permission.admin.policy=authenticated

quarkus.http.auth.permission.protected.paths=/api/protected
quarkus.http.auth.permission.protected.policy=authenticated

# =============================================================================
# CORS
# =============================================================================
quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:4200
%dev.quarkus.http.cors.access-control-allow-credentials=true
